# alembic.ini — Alembic configuration for Astronex
# The actual database URL is injected at runtime by alembic/env.py
# from the DATABASE_URL environment variable / .env file.

[alembic]
script_location = alembic
prepend_sys_path = .

# File naming template for new revisions (alembic revision --autogenerate)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

version_path_separator = os

# Placeholder — env.py reads the real URL from the environment.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
