<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astro-Magister – Portal für astrologische Selbsterfahrung</title>

    <!-- SEO: Base meta -->
    <meta name="description" content="Astro-Magister ist ein Portal für astrologische Selbsterfahrung. Erforsche dein Horoskop, Planeten, Häuser, Transite, Alterspunkte und das astrologische Wiki." />
    <meta name="keywords" content="Astrologie, Horoskop, Planeten, Häuser, Transite, Alterspunkte, Solar Jahr, astrologische Deutung, Wiki Astrologie" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.astro-magister.de/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.astro-magister.de/" />
    <meta property="og:site_name" content="Astro-Magister" />
    <meta property="og:title" content="Astro-Magister – Portal für astrologische Selbsterfahrung" />
    <meta property="og:description" content="Erforsche dein Horoskop, Planeten, Häuser, Transite, Alterspunkte und das astrologische Wiki auf Astro-Magister." />
    <meta property="og:locale" content="de_DE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Astro-Magister – Portal für astrologische Selbsterfahrung" />
    <meta name="twitter:description" content="Erforsche dein Horoskop, Planeten, Häuser, Transite, Alterspunkte und das astrologische Wiki auf Astro-Magister." />

    <!-- Theme -->
    <meta name="theme-color" content="#0f766e" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Astro-Magister",
      "url": "https://www.astro-magister.de/",
      "description": "Portal für astrologische Selbsterfahrung – Horoskop, Planeten, Häuser, Transite, Alterspunkte und Wiki.",
      "inLanguage": "de-DE",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.astro-magister.de/"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Anti-flash zodiac theme — runs before React to prevent wrong-color flash on first paint -->
    <script>
      (function () {
        var boundaries = [
          { start: [3, 21], end: [4, 19], sign: 0 },   // Aries:       Mar 21 – Apr 19
          { start: [4, 20], end: [5, 20], sign: 1 },   // Taurus:      Apr 20 – May 20
          { start: [5, 21], end: [6, 20], sign: 2 },   // Gemini:      May 21 – Jun 20
          { start: [6, 21], end: [7, 22], sign: 3 },   // Cancer:      Jun 21 – Jul 22
          { start: [7, 23], end: [8, 22], sign: 4 },   // Leo:         Jul 23 – Aug 22
          { start: [8, 23], end: [9, 22], sign: 5 },   // Virgo:       Aug 23 – Sep 22
          { start: [9, 23], end: [10, 22], sign: 6 },  // Libra:       Sep 23 – Oct 22
          { start: [10, 23], end: [11, 21], sign: 7 }, // Scorpio:     Oct 23 – Nov 21
          { start: [11, 22], end: [12, 21], sign: 8 }, // Sagittarius: Nov 22 – Dec 21
          { start: [12, 22], end: [1, 19], sign: 9 },  // Capricorn:   Dec 22 – Jan 19 (year-spanning)
          { start: [1, 20], end: [2, 18], sign: 10 },  // Aquarius:    Jan 20 – Feb 18
          { start: [2, 19], end: [3, 20], sign: 11 }   // Pisces:      Feb 19 – Mar 20
        ];

        var palettes = {};
        palettes[0] = { accent: "#8B1A1A", panel: "#FEF5F5", accentSoft: "#FDE8E8", shadow: "0 18px 40px rgba(139,26,26,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(253,232,232,0.7), transparent 28%), linear-gradient(180deg, #fef5f5 0%, #fefbfb 44%, #fdf5f5 100%)" };
        palettes[1] = { accent: "#7A5C2C", panel: "#F8F5F0", accentSoft: "#F0EBE0", shadow: "0 18px 40px rgba(122,92,44,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(240,235,224,0.7), transparent 28%), linear-gradient(180deg, #f8f5f0 0%, #fbfaf8 44%, #f5f2ec 100%)" };
        palettes[2] = { accent: "#5A7A2C", panel: "#F6F9F0", accentSoft: "#ECF2E0", shadow: "0 18px 40px rgba(90,122,44,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(236,242,224,0.7), transparent 28%), linear-gradient(180deg, #f6f9f0 0%, #fbfcf8 44%, #f2f6ec 100%)" };
        palettes[3] = { accent: "#4A6FA5", panel: "#F5F8FC", accentSoft: "#E8F0F8", shadow: "0 18px 40px rgba(74,111,165,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(232,240,248,0.7), transparent 28%), linear-gradient(180deg, #f5f8fc 0%, #f8fbfc 44%, #f0f4f9 100%)" };
        palettes[4] = { accent: "#B84C2B", panel: "#FEF9F5", accentSoft: "#FDEEE6", shadow: "0 18px 40px rgba(184,76,43,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(253,238,230,0.7), transparent 28%), linear-gradient(180deg, #fef9f5 0%, #fefbfb 44%, #fef5f5 100%)" };
        palettes[5] = { accent: "#6B5B3D", panel: "#F6F3ED", accentSoft: "#EDE8DE", shadow: "0 18px 40px rgba(107,91,61,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(237,232,222,0.7), transparent 28%), linear-gradient(180deg, #f6f3ed 0%, #fbfaf7 44%, #f3f0ea 100%)" };
        palettes[6] = { accent: "#7A8B6A", panel: "#F5F7F2", accentSoft: "#EAEFE5", shadow: "0 18px 40px rgba(122,139,106,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(234,239,229,0.7), transparent 28%), linear-gradient(180deg, #f5f7f2 0%, #fbfcf9 44%, #f2f5ef 100%)" };
        palettes[7] = { accent: "#2C3E6B", panel: "#F0F3F8", accentSoft: "#E0E6F2", shadow: "0 18px 40px rgba(44,62,107,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(224,230,242,0.7), transparent 28%), linear-gradient(180deg, #f0f3f8 0%, #f8fafc 44%, #eef2f8 100%)" };
        palettes[8] = { accent: "#6C3483", panel: "#FBF5FE", accentSoft: "#F5E8FA", shadow: "0 18px 40px rgba(108,52,131,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(245,232,250,0.7), transparent 28%), linear-gradient(180deg, #fbf5fe 0%, #fefbfb 44%, #fef5fe 100%)" };
        palettes[9] = { accent: "#4A4238", panel: "#F0EDE8", accentSoft: "#E5E0D8", shadow: "0 18px 40px rgba(74,66,56,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(229,224,216,0.7), transparent 28%), linear-gradient(180deg, #f0ede8 0%, #faf8f5 44%, #edeae5 100%)" };
        palettes[10] = { accent: "#1A6B6B", panel: "#F0F8F8", accentSoft: "#E0F2F2", shadow: "0 18px 40px rgba(26,107,107,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(224,242,242,0.7), transparent 28%), linear-gradient(180deg, #f0f8f8 0%, #f8fcfc 44%, #edf5f5 100%)" };
        palettes[11] = { accent: "#1A6B5A", panel: "#F0F8F5", accentSoft: "#E0F2EC", shadow: "0 18px 40px rgba(26,107,90,0.10)", bodyGradient: "radial-gradient(circle at top right, rgba(224,242,236,0.7), transparent 28%), linear-gradient(180deg, #f0f8f5 0%, #f8fcfb 44%, #edf5f2 100%)" };

        window.__ZODIAC_DEFAULTS__ = { boundaries: boundaries, palettes: palettes };

        // Initialize theme enabled flag if not set (Phase 32)
        if (localStorage.getItem('zodiacThemeEnabled') === null) {
          localStorage.setItem('zodiacThemeEnabled', 'true');
        }

        var now = new Date();
        var month = now.getMonth() + 1;
        var day = now.getDate();
        var signIndex = 0;

        for (var i = 0; i < boundaries.length; i++) {
          var b = boundaries[i];
          var sm = b.start[0], sd = b.start[1];
          var em = b.end[0], ed = b.end[1];
          var inRange = false;

          if (sm <= em) {
            inRange = (month > sm || (month === sm && day >= sd)) && (month < em || (month === em && day <= ed));
          } else {
            inRange = (month > sm || (month === sm && day >= sd)) || (month < em || (month === em && day <= ed));
          }

          if (inRange) { signIndex = b.sign; break; }
        }

        var p = palettes[signIndex];

        // Apply saved theme overrides from localStorage if they exist
        try {
          var saved = localStorage.getItem('zodiacTheme');
          if (saved) {
            var theme = JSON.parse(saved);
            var entry = theme[String(signIndex)];
            if (entry && entry.accent && entry.panel && entry.accentSoft && entry.shadow) {
              p = entry;
            }
          }
        } catch(e) { /* ignore parse errors */ }

        var root = document.documentElement.style;
        root.setProperty('--admin-accent', p.accent);
        root.setProperty('--admin-panel', p.panel);
        root.setProperty('--admin-accent-soft', p.accentSoft);
        root.setProperty('--admin-shadow', p.shadow);

        // Build body gradient from accentSoft + panel if not provided
        var gradient = p.bodyGradient;
        if (!gradient) {
          var soft = p.accentSoft.replace('#','');
          var r = parseInt(soft.substring(0,2), 16);
          var g = parseInt(soft.substring(2,4), 16);
          var b = parseInt(soft.substring(4,6), 16);
          gradient = 'radial-gradient(circle at top right, rgba('+r+','+g+','+b+',0.7), transparent 28%),' +
            ' linear-gradient(180deg, ' + p.panel + ' 0%, #fefbfb 44%, ' + p.panel + ' 100%)';
        }
        document.body.style.background = gradient;

        // RGB components for accent-coloured tabs
        var acc = p.accent.replace('#','');
        root.setProperty('--admin-accent-r', parseInt(acc.substring(0,2), 16));
        root.setProperty('--admin-accent-g', parseInt(acc.substring(2,4), 16));
        root.setProperty('--admin-accent-b', parseInt(acc.substring(4,6), 16));
      })();
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
