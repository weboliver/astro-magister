name: astronex

services:
  db:
    image: postgres:16-alpine
    container_name: astronex-db
    # D-07: no-new-privileges für alle sechs Services; db bleibt Root (D-06).
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      astronex_internal:
        ipv4_address: ${NETWORK_IP_PREFIX:-172.28.0}.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: astronex-redis
    # D-07: no-new-privileges für alle sechs Services; redis bleibt Root (D-06).
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      astronex_internal:
        ipv4_address: ${NETWORK_IP_PREFIX:-172.28.0}.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      # Keine Provenance-/SBOM-Attestations: sonst zeigt der Tag auf eine Manifest-Liste
      # und `docker ps` nennt für den Container nur eine sha256-ID statt "astronex-api:dev".
      provenance: false
    image: astronex-api:dev
    container_name: astronex-api
    # Härtung (Phase 45, CONT-02/D-01/D-07):
    # `cap_drop: ALL` nimmt dem Prozess das komplette Docker-Default-Capability-Set —
    # die API braucht keine davon. Ein `cap_add` gibt es hier bewusst nicht.
    # Die Prozess-Identität steht ausschließlich im Dockerfile (`USER 1000:1000`):
    # eine zweite Quelle hier würde `up`, `run` und `exec` auseinanderlaufen lassen.
    # `no-new-privileges` verhindert, dass setuid/setcap-Binaries Rechte zurückholen.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Härtung (Phase 46, CONT-04/D-01/D-02/D-04): Das Rootfs ist schreibgeschützt.
    # Jeder Pfad, in den der Prozess real schreibt, steht hier als tmpfs mit explizitem
    # size/mode/uid/gid — kein Kernel- oder Docker-Default. Gemessener Bedarf (2026-11-08):
    #   /tmp             31 MB Bytecode-Prefix (uvicorn --workers 4) + Heredoc-Tempfiles
    #   /home/app/.astronex  1 KB (cfg.ini); /home/app/.cache 40 KB (fontconfig)
    #   /run, /var/tmp   0 B (Grundmenge aus D-01)
    # Die Option-String-Form ist die einzige Compose-Variante mit uid/gid und die einzige,
    # die in `HostConfig.Tmpfs` sichtbar ist (die volumes-Langform kann kein uid/gid).
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m,mode=1777
      - /run:rw,size=8m,mode=0755
      - /var/tmp:rw,size=8m,mode=1777
      - /home/app/.astronex:rw,size=8m,mode=0750,uid=1000,gid=1000
      # /home/app/.cache ist ein BELEGTER Schreibpfad: fontconfig legt dort beim Start
      # 5 Cache-Dateien (40 KB) an und klagt sonst mit
      # `Fontconfig error: No writable cache directories`. /run und /var/tmp sind die
      # Grundmenge aus D-01, gemessen 0 B.
      - /home/app/.cache:rw,size=16m,mode=0700,uid=1000,gid=1000
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      DB_WAIT_TIMEOUT_SECONDS: "180"
      # Muss zur nginx-Container-IP passen und folgt daher NETWORK_IP_PREFIX.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-${NETWORK_IP_PREFIX:-172.28.0}.15}"
      SEED_USERS: "0"
      SEED_LOCATIONS: "1"
      MIGRATE_IF_EMPTY_ONLY: "1"
      FORCE_MIGRATIONS: "0"
      SEED_E2E_USER: "${SEED_E2E_USER:-0}"
      BYPASS_CAPTCHA: "${BYPASS_CAPTCHA:-false}"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ../:/workspace
    networks:
      astronex_internal:
        ipv4_address: ${NETWORK_IP_PREFIX:-172.28.0}.12
    command: >
      /bin/sh -c "
      export PATH=/opt/venv/bin:$$PATH &&
      bash ./scripts/docker_init_postgres.sh &&
      DEBUG_NORMALIZED=$$(printf '%s' "$${DEBUG:-false}" | tr '[:upper:]' '[:lower:]') &&
      if [ "$$DEBUG_NORMALIZED" = "true" ] || [ "$$DEBUG_NORMALIZED" = "1" ] || [ "$$DEBUG_NORMALIZED" = "yes" ] || [ "$$DEBUG_NORMALIZED" = "on" ]; then
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/app;
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4;
      fi
      "

  frontend:
    image: node:20-alpine
    container_name: astronex-frontend
    # D-07: no-new-privileges für alle sechs Services; frontend bleibt Root (D-06).
    security_opt:
      - no-new-privileges:true
    working_dir: /workspace/app/frontend
    env_file:
      - ../.env
    volumes:
      - ../:/workspace
    networks:
      astronex_internal:
        ipv4_address: ${NETWORK_IP_PREFIX:-172.28.0}.13
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_PROXY_TARGET: http://api:8000
      VITE_TURNSTILE_SITE_KEY: "${VITE_TURNSTILE_SITE_KEY:-}"
    # Phase 48 / D-12: `npm ci` liest ausschließlich den getrackten
    # `app/frontend/package-lock.json`, schreibt ihn nie und validiert die Sync mit
    # `package.json`. Gemessen 2026-11-18 in `node:20-alpine` (node v20.20.2,
    # npm 10.8.2): `npm ci` 5,03 s, `node_modules` 79,9 MB, `npm run build` grün
    # (`✓ built in 4.06s`). Den abgelösten Install-Befehl nennt dieser Kommentar
    # bewusst nicht — die Zählung im Akzeptanzkriterium misst die Datei mit.
    command: >
      /bin/sh -c "
      npm ci &&
      DEBUG_NORMALIZED=$$(printf '%s' \"$${DEBUG:-false}\" | tr '[:upper:]' '[:lower:]') &&
      if [ \"$$DEBUG_NORMALIZED\" = \"true\" ] || [ \"$$DEBUG_NORMALIZED\" = \"1\" ] || [ \"$$DEBUG_NORMALIZED\" = \"yes\" ] || [ \"$$DEBUG_NORMALIZED\" = \"on\" ]; then
        npm run dev -- --host 0.0.0.0 --port 5173;
      else
        npm run build && npm run preview -- --host 0.0.0.0 --port 5173;
      fi
      "

  wiki-builder:
    image: node:20-alpine
    container_name: astronex-wiki-builder
    # D-07: no-new-privileges für alle sechs Services; wiki-builder bleibt Root (D-06).
    security_opt:
      - no-new-privileges:true
    working_dir: /workspace
    volumes:
      - ../:/workspace
    networks:
      astronex_internal:
        ipv4_address: ${NETWORK_IP_PREFIX:-172.28.0}.14
    command: node /workspace/docker/wiki-build-server.js
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
      provenance: false
    image: astronex-nginx:letsencrypt
    container_name: astronex-nginx
    # D-07: no-new-privileges für alle sechs Services.
    # Härtung (Phase 45, CONT-01/CONT-02/D-09): nginx läuft als UID 1000
    # (`USER 1000:1000` im Dockerfile — eine Wahrheit, kein `user:` hier) und bindet
    # 80/443 über den explizit gesetzten Sysctl. Ohne diesen Key wäre die Bindung an
    # einen Docker-Daemon-Default gehängt statt an die Compose-Datei; der Kernel-Wert
    # ist zwar heute schon `0`, aber `HostConfig.Sysctls` wäre `null`.
    # `cap_add: [NET_BIND_SERVICE]` verlangt CONT-02 wörtlich. Für einen Nicht-Root-
    # Prozess unter `no-new-privileges` wirkt es nur als Bounding-Set — die effektive
    # Capability-Menge von nginx ist leer (gemessen: CapEff=0). Das ist strenger als
    # gefordert, kein Mangel. `CapDrop` bleibt `[ALL]`, kein `setcap` im Image (D-09).
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./certs:/etc/nginx/dev-certs:ro
      - ../:/workspace:ro
    networks:
      astronex_internal:
        ipv4_address: ${NETWORK_IP_PREFIX:-172.28.0}.15

networks:
  # Name, Subnetz und IP-Block sind über die .env steuerbar (siehe .env.example).
  # NETWORK_IP_PREFIX sind die ersten drei Oktette von NETWORK_SUBNET; daraus werden
  # die statischen Container-IPs .10 bis .15 gebildet. Ist NETWORK_IP_PREFIX nicht
  # gesetzt, leiten docker/build.sh, start.sh und update.sh ihn aus NETWORK_SUBNET ab.
  astronex_internal:
    name: ${NETWORK_NAME:-astronex_internal}
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}

volumes:
  postgres_data:
    name: docker_postgres_data
  redis_data:
    name: docker_redis_data
  letsencrypt_data:
    name: docker_letsencrypt_data
  certbot_webroot:
    name: docker_certbot_webroot
