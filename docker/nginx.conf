load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nur explizit vertrauten Reverse Proxies erlauben, die Client-IP zu setzen.
    # Vollstaendige Cloudflare-IP-Liste: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # GeoIP2 darf X-Forwarded-For nur von denselben vertrauenswuerdigen Proxies auswerten.
    geoip2_proxy 173.245.48.0/20;
    geoip2_proxy 103.21.244.0/22;
    geoip2_proxy 103.22.200.0/22;
    geoip2_proxy 103.31.4.0/22;
    geoip2_proxy 141.101.64.0/18;
    geoip2_proxy 108.162.192.0/18;
    geoip2_proxy 190.93.240.0/20;
    geoip2_proxy 188.114.96.0/20;
    geoip2_proxy 197.234.240.0/22;
    geoip2_proxy 198.41.128.0/17;
    geoip2_proxy 162.158.0.0/15;
    geoip2_proxy 104.16.0.0/13;
    geoip2_proxy 104.24.0.0/14;
    geoip2_proxy 172.64.0.0/13;
    geoip2_proxy 131.0.72.0/22;
    geoip2_proxy 2400:cb00::/32;
    geoip2_proxy 2606:4700::/32;
    geoip2_proxy 2803:f800::/32;
    geoip2_proxy 2405:b500::/32;
    geoip2_proxy 2405:8100::/32;
    geoip2_proxy 2a06:98c0::/29;
    geoip2_proxy_recursive on;        # Rekursiv wie real_ip
    # Global: Rate Limit Zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=100r/m;
    limit_req_status 429;
    error_page 429 = @ratelimited;
    
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
