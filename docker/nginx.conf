# Kein `user`-Direktive: der Master läuft bereits als nicht-privilegierter User
# (UID 1000, `USER` im Dockerfile). Als Root wäre sie ein No-Op/Warnung, als
# Non-Root ist sie wirkungslos — `nginx -t` bliebe sonst nicht sauber.
# `pid /run/nginx.pid;` bleibt: genau dieser Pfad erzwingt das `chown /run` im Image.
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    # Keine Versionsnummer im Server-Header (SC 5 / CONT-06). Bewusst hier im
    # http-Kontext und nicht doppelt in beiden Templates: eine Stelle gilt fuer
    # nginx.http.conf.template und nginx.https.conf.template gleichermassen.
    # Gemessener Zielwert ist `Server: nginx` — ausdruecklich NICHT headers-more/
    # more_set_headers und NICHT das Entfernen des Headers: SC 5 verlangt "ohne
    # Versionsnummer", nicht "ohne Header" (45-RESEARCH.md, Pitfall 6).
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nur explizit vertrauten Reverse Proxies erlauben, die Client-IP zu setzen.
    # Vollstaendige Cloudflare-IP-Liste: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Global: Rate Limit Zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # EINE Sichtbarkeitsregel fuer Suchmaschinen (SEO-06, D-01).
    # Sie steht hier im http-Kontext, weil `map` nur dort erlaubt ist (im `server`-Block
    # waere es `[emerg] "map" directive is not allowed here`) und weil beide Server-Bloecke
    # — docker/nginx.https.conf.template und docker/nginx.http.conf.template — dieselbe
    # Aussage lesen sollen. Eine zweite Regel (React-Meta, robots.txt) gibt es bewusst nicht.
    # Quelle ist $uri (normalisierter Pfad OHNE Query), nicht $request_uri: eine
    # Marketing-Query darf die Landingpage nicht auf noindex stellen (`/?x=1` bleibt index).
    # `default` ist die sichere Seite — nur / und das statische Wiki sind indexierbar;
    # Rechnerseiten, App-Wiki und Auswertungen bleiben unauffindbar.
    # Der Regex ist auf `^/astro-wiki(/|$)` verankert, damit /astro-wikifoo (SPA-Fallback)
    # nicht mitgemeint ist.
    # Ausnahme zu Annahme A2 (Betreiberentscheidung 2026-11-03): die Sitemap-Datei selbst ist
    # indexierbar, statt unter den Default zu fallen — sie ist die Inventarliste, deren
    # Verarbeitung nicht an einem noindex auf ihr scheitern soll. /robots.txt bleibt beim
    # Default: die Datei ist kein Suchergebnis und wird unabhängig davon abgerufen.
    map $uri $robots_tag {
        default            "noindex, nofollow";
        /                  "index, follow";
        "~^/astro-wiki(/|$)" "index, follow";
        /sitemap.xml       "index, follow";
    }

    # Phase 47 (D-02, R-01): Nur HTML-Dokumente der SPA bekommen `private, no-cache` — sie tragen
    # einen pro Request erzeugten Nonce. Alle anderen Antworten (Vite-Module, gehashte Bundles)
    # behalten den Cache-Control-Wert des Upstreams: die Location / ist ein Catch-all-Proxy, eine
    # location-weite Regel wuerde jedes Bundle no-cache machen und zugleich un-revalidierbar.
    # Ein leerer Wert erzeugt KEINEN Header (Nicht-HTML ohne Upstream-Cache-Control bleibt ohne).
    map $sent_http_content_type $spa_cache_control {
        "~^text/html"  "private, no-cache";
        default        $upstream_http_cache_control;
    }
    # Bedingte Requests nur für Dokument-Navigationen unterdrücken (Accept enthält text/html);
    # ein 304 auf ein HTML-Dokument hiesse: frischer Nonce im Header, alter Body im Cache.
    # Für Module/Bundles bleibt die Revalidierung damit erhalten (R-01).
    map $http_accept $spa_if_none_match {
        "~text/html"   "";
        default        $http_if_none_match;
    }
    map $http_accept $spa_if_modified_since {
        "~text/html"   "";
        default        $http_if_modified_since;
    }

    error_page 429 = @ratelimited;
    
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
